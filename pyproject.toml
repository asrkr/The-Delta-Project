[project]
name = "the-delta-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayan Sarkar", email = "a.sarkar@outlook.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[project.scripts]
the-delta-project = "the_delta_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
minversion = "8.8"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["the_delta_project"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
